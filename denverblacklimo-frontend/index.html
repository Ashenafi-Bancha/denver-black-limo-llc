<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons. Google's crawler probes /favicon.ico first and only then reads
         these tags, so a real .ico has to exist at the root — otherwise the SPA
         catchall answers with HTML and Search falls back to the blank globe.
         The files are genuine PNGs: /images/logo.png is JPEG data under a .png
         name, which the crawler rejects. Sizes are multiples of 48 as Google asks. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Google Search Console ownership. Public by design — it only proves we control
         the site. The same token also works as a DNS TXT record on the domain. -->
    <meta name="google-site-verification" content="IYTbe0tlZAeClE0xDJ0DaG0T1SEk7kIoIAmA5GSveFY" />

    <title>Denver Black Limo LLC | Luxury Chauffeured Car Service in Denver, CO</title>
    <meta
      name="description"
      content="Denver's premier luxury chauffeured transportation. Airport transfers to DIA, corporate travel, weddings, mountain resorts, and private aviation. Professional chauffeurs, immaculate black vehicles, available 24/7."
    />
    <meta
      name="keywords"
      content="Denver limo, Denver black car service, DIA airport transfer, luxury chauffeur Denver, Denver car service, executive transportation Denver, wedding limo Denver, mountain resort transportation, Vail Aspen Breckenridge car service"
    />
    <meta name="author" content="Denver Black Limo LLC" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://denverblacklimo.llc/" />

    <!-- Local SEO / geo -->
    <meta name="geo.region" content="US-CO" />
    <meta name="geo.placename" content="Denver, Colorado" />
    <meta name="geo.position" content="39.7392;-104.9903" />
    <meta name="ICBM" content="39.7392, -104.9903" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Denver Black Limo LLC" />
    <meta property="og:title" content="Denver Black Limo LLC | Luxury Chauffeured Car Service in Denver, CO" />
    <meta property="og:description" content="Denver's premier luxury chauffeured transportation — airport transfers, corporate travel, weddings, mountain resorts, and 24/7 premium service." />
    <!-- logo.jpg, not logo.png: the .png file is really JPEG data, and a served
         type that contradicts the bytes gets dropped by some scrapers. -->
    <meta property="og:image" content="https://denverblacklimo.llc/images/logo.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1254" />
    <meta property="og:image:height" content="1254" />
    <meta property="og:image:alt" content="Denver Black Limo LLC logo" />
    <meta property="og:url" content="https://denverblacklimo.llc/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Denver Black Limo LLC | Luxury Chauffeured Car Service in Denver, CO" />
    <meta name="twitter:description" content="Denver's premier luxury chauffeured transportation — airport, corporate, weddings, mountain resorts, 24/7." />
    <meta name="twitter:image" content="https://denverblacklimo.llc/images/logo.jpg" />
    <meta name="twitter:image:alt" content="Denver Black Limo LLC logo" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: local limousine business -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LimousineService",
        "@id": "https://denverblacklimo.llc/#business",
        "name": "Denver Black Limo LLC",
        "url": "https://denverblacklimo.llc",
        "logo": {
          "@type": "ImageObject",
          "url": "https://denverblacklimo.llc/images/logo-512.png",
          "contentUrl": "https://denverblacklimo.llc/images/logo-512.png",
          "width": 512,
          "height": 512,
          "caption": "Denver Black Limo LLC"
        },
        "image": "https://denverblacklimo.llc/images/logo.jpg",
        "description": "Luxury chauffeured transportation in Denver, Colorado — airport transfers, corporate travel, weddings, mountain resorts, and private aviation.",
        "telephone": "+1-720-499-6744",
        "email": "info@denverblacklimo.llc",
        "priceRange": "$$$",
        "foundingDate": "2019-09",
        "areaServed": [
          { "@type": "City", "name": "Denver" },
          { "@type": "AdministrativeArea", "name": "Colorado Front Range" }
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Denver",
          "addressRegion": "CO",
          "addressCountry": "US"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 39.7392, "longitude": -104.9903 },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
          "opens": "00:00",
          "closes": "23:59"
        },
        "sameAs": [
          "https://www.facebook.com/profile.php?id=61592643747921",
          "https://www.instagram.com/denverblacklimo.llc"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
